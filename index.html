<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Specimen of the Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --tray:#0E1218;        /* specimen tray velvet */
  --plate:#151B24;       /* lifted card */
  --rule:#2C3542;        /* oxidized silver hairline */
  --rule-bright:#46525F;
  --bone:#E8E4DA;        /* label paper */
  --slate:#8B94A3;       /* secondary ink */
  --dim:#5C6675;
  --opal-a:#7FD4C1;
  --opal-b:#9B8FD9;
  --opal-c:#F2A65A;
  --opal-d:#E85A7F;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --serif:'Cormorant',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--tray);
  color:var(--bone);
  font-family:var(--mono);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 20px 48px;
  -webkit-font-smoothing:antialiased;
}
/* faint vignette so the tray reads as cloth, not flat black */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 34%,rgba(120,140,170,.07),transparent 62%);
}
.wrap{width:100%;max-width:660px;position:relative;z-index:1}

/* ── rail ── */
.rail{
  display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:22px 0 14px;
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
}
.rail .acc{color:var(--slate)}
.sound{
  background:none;border:1px solid var(--rule);color:var(--slate);
  font:inherit;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  padding:7px 13px;border-radius:2px;cursor:pointer;
  display:flex;align-items:center;gap:8px;transition:border-color .25s,color .25s;
}
.sound:hover{border-color:var(--rule-bright);color:var(--bone)}
.sound[aria-pressed="true"]{color:var(--opal-a);border-color:#31544E}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45}
.sound[aria-pressed="true"] .dot{opacity:1;animation:pulse 3.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

hr.line{border:0;border-top:1px solid var(--rule);margin:0}

/* ── plate ── */
.plate{padding:34px 0 20px;display:flex;justify-content:center}
.flower{width:min(78vw,320px);height:min(78vw,320px);overflow:visible}
.flower path,.flower circle,.flower line{
  stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);
  animation:ink 1.15s cubic-bezier(.32,.72,.3,1) forwards;
}
@keyframes ink{to{stroke-dashoffset:0}}
.flower .fillgrp{opacity:0;animation:bloom .9s ease-out .38s forwards}
@keyframes bloom{to{opacity:1}}

/* ── catalogue fields ── */
.ident{text-align:center;padding:4px 0 26px}
.latin{
  font-family:var(--serif);font-style:italic;font-weight:400;
  font-size:26px;letter-spacing:.01em;margin:0 0 9px;color:var(--bone);
}
.common{
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
}
.common b{font-weight:400;color:var(--slate)}

/* ── quote ── */
.quote{padding:34px 4px 30px;text-align:center}
.quote p{
  font-family:var(--serif);font-weight:300;font-style:italic;
  font-size:clamp(21px,5.2vw,31px);line-height:1.45;
  margin:0 0 18px;color:var(--bone);text-wrap:balance;
}
.attr{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}

/* ── nav ── */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 0}
.nav button{
  background:none;border:1px solid var(--rule);color:var(--slate);
  font:inherit;font-size:11px;padding:9px 14px;border-radius:2px;cursor:pointer;
  transition:border-color .25s,color .25s;
}
.nav button:hover{border-color:var(--rule-bright);color:var(--bone)}
.nav .today{
  flex:1;text-align:center;border:0;color:var(--slate);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:9px 0;
}
.nav .today:hover{color:var(--bone)}

/* ── month grid ── */
.month{display:none;padding:26px 0 4px}
.month.open{display:block;animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mhead{
  display:flex;justify-content:space-between;align-items:center;
  font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);
  padding-bottom:14px;
}
.mhead button{background:none;border:0;color:var(--dim);font:inherit;cursor:pointer;padding:4px 8px}
.mhead button:hover{color:var(--bone)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{
  text-align:center;font-size:9px;letter-spacing:.14em;color:var(--dim);
  padding-bottom:8px;text-transform:uppercase;
}
.cell{
  aspect-ratio:1;border:0;background:none;cursor:pointer;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  border-radius:2px;transition:background .2s;
}
.cell:hover{background:rgba(255,255,255,.04)}
.cell.blank{cursor:default}
.cell.blank:hover{background:none}
.cell .num{font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
.cell.sel .num{color:var(--bone)}
.cell .mark{width:9px;height:9px;border-radius:50%;opacity:.62}
.cell.sel{background:rgba(255,255,255,.07)}
.cell.now .num{text-decoration:underline;text-underline-offset:3px}

button:focus-visible,.cell:focus-visible{outline:1px solid var(--opal-a);outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .flower path,.flower circle,.flower line{stroke-dashoffset:0}
  .flower .fillgrp{opacity:1}
}
@media (max-width:420px){
  .quote{padding:26px 0 24px}
  .nav button{padding:9px 11px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="rail">
    <span class="acc" id="acc">ACC —</span>
    <button class="sound" id="sound" aria-pressed="false">
      <span class="dot"></span><span id="soundlabel">Sound off</span>
    </button>
  </div>
  <hr class="line">

  <div class="plate"><svg class="flower" id="flower" viewBox="-160 -160 320 320" aria-hidden="true"></svg></div>

  <div class="ident">
    <p class="latin" id="latin"></p>
    <p class="common" id="common"></p>
  </div>

  <hr class="line">
  <blockquote class="quote">
    <p id="quote"></p>
    <div class="attr" id="attr"></div>
  </blockquote>
  <hr class="line">

  <div class="nav">
    <button id="prev" aria-label="Previous day">←</button>
    <button class="today" id="datelabel"></button>
    <button id="next" aria-label="Next day">→</button>
  </div>

  <div class="month" id="month">
    <div class="mhead">
      <button id="mprev" aria-label="Previous month">←</button>

    </div>
    <div class="grid" id="dows"></div>
    <div class="grid" id="grid"></div>
  </div>

</div>

 ["Judge a man by his questions rather than his answers.","Voltaire"],
 ["We are all in the gutter, but some of us are looking at the stars.","Oscar Wilde"],
 ["Be yourself; everyone else is already taken.","Oscar Wilde"],

];

/* ── deterministic selection ──────────────────────────────
   Step by a number coprime with the array length so a full
   cycle passes before anything repeats.                     */
const FSTEP = 23, QSTEP = 17;
const ord = d => Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(d.getFullYear(),0,0)) / 864e5);
const idx = (d,n,step) => ((ord(d)*step + d.getFullYear()*7) % n + n) % n;
const flowerFor = d => FLOWERS[idx(d,FLOWERS.length,FSTEP)];
const quoteFor  = d => QUOTES[idx(d,QUOTES.length,QSTEP)];

/* seeded rng, so the same date always draws the same bloom */
function rngFor(d){
  let a = (d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate()) | 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}

/* ── drawing the specimen ────────────────────────────────── */
function petalPath(len, wid, form, curl){
  const w = wid, L = len;
  switch(form){
    case "point":  return `M0,0 C${w*.7},${-L*.28} ${w*.5},${-L*.72} 0,${-L} C${-w*.5},${-L*.72} ${-w*.7},${-L*.28} 0,0 Z`;
    case "strap":  return `M0,0 C${w*.5},${-L*.3} ${w*.42},${-L*.8} ${curl*w*.3},${-L} C${-w*.42},${-L*.8} ${-w*.5},${-L*.3} 0,0 Z`;
    case "cup":    return `M0,0 C${w*1.05},${-L*.35} ${w*.85},${-L*.9} 0,${-L*.94} C${-w*.85},${-L*.9} ${-w*1.05},${-L*.35} 0,0 Z`;
    case "bell":   return `M0,0 C${w*.55},${-L*.5} ${w*.95},${-L*.85} ${w*.34},${-L} C0,${-L*.86} 0,${-L*.86} ${-w*.34},${-L} C${-w*.95},${-L*.85} ${-w*.55},${-L*.5} 0,0 Z`;
    case "ruffle": return `M0,0 C${w},${-L*.3} ${w*.55},${-L*.6} ${w*.68},${-L*.88} C${w*.3},${-L*1.02} ${w*.12},${-L*.9} 0,${-L} C${-w*.12},${-L*.9} ${-w*.3},${-L*1.02} ${-w*.68},${-L*.88} C${-w*.55},${-L*.6} ${-w},${-L*.3} 0,0 Z`;
    default:       return `M0,0 C${w},${-L*.36} ${w*.8},${-L*.94} 0,${-L} C${-w*.8},${-L*.94} ${-w},${-L*.36} 0,0 Z`;
  }
}

function drawFlower(svg, f, rnd){
  const OP = ["#7FD4C1","#9B8FD9","#F2A65A","#E85A7F"];
  let defs = `<defs>
    <radialGradient id="pg" cx="50%" cy="92%" r="88%">
      <stop offset="0%" stop-color="${f.c2}"/><stop offset="72%" stop-color="${f.c1}"/>
      <stop offset="100%" stop-color="${f.c1}" stop-opacity=".9"/>
    </radialGradient>
    <linearGradient id="opal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="${OP[Math.floor(rnd()*4)]}" stop-opacity=".34"/>
      <stop offset="46%" stop-color="${OP[Math.floor(rnd()*4)]}" stop-opacity=".13"/>
      <stop offset="100%" stop-color="${OP[Math.floor(rnd()*4)]}" stop-opacity=".30"/>
    </linearGradient>
    <radialGradient id="cg" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="${f.core}" stop-opacity=".72"/>
      <stop offset="100%" stop-color="${f.core}"/>
    </radialGradient>
  </defs>`;

  let fills = "", lines = "", delay = 0;
  const base = 108 + rnd()*16;

  for(let layer = f.layers - 1; layer >= 0; layer--){
    const scale  = 1 - layer*0.235;
    const n      = Math.max(3, Math.round(f.petals * (1 - layer*0.14)));
    const spin   = layer * (180/n) + rnd()*14;
    const wid    = base * 0.40 * scale;
    for(let i = 0; i < n; i++){
      const a    = spin + (360/n)*i + (rnd()-0.5)*4.5;
      const L    = base * scale * (0.9 + rnd()*0.2);
      const curl = (rnd()-0.5) * 1.6;
      const d    = petalPath(L, wid, f.form, curl);
      const dim  = 1 - layer*0.1;
      fills += `<g transform="rotate(${a})">
          <path d="${d}" fill="url(#pg)" opacity="${dim}"/>
          <path d="${d}" fill="url(#opal)" style="mix-blend-mode:screen"/>
        </g>`;
      lines += `<path d="${d}" transform="rotate(${a})" fill="none"
          stroke="rgba(255,255,255,${0.16 - layer*0.04})" stroke-width=".85"
          style="--len:${Math.round(L*2.6)};animation-delay:${(delay+=9)}ms"/>`;
    }
  }

  /* centre */
  const cr = base * 0.155;
  fills += `<circle r="${cr}" fill="url(#cg)"/>`;
  const stam = 9 + Math.floor(rnd()*9);
  for(let i = 0; i < stam; i++){
    const a = (360/stam)*i + rnd()*10, rr = cr*(0.5 + rnd()*0.62);
    fills += `<circle r="1.5" cx="${rr*Math.cos(a*Math.PI/180)}" cy="${rr*Math.sin(a*Math.PI/180)}"
        fill="#F4EEDC" opacity="${.35 + rnd()*.4}"/>`;
  }
  lines += `<circle r="${cr}" fill="none" stroke="rgba(255,255,255,.2)" stroke-width=".85"
      style="--len:${Math.round(2*Math.PI*cr)};animation-delay:${delay+70}ms"/>`;

  svg.innerHTML = defs + `<g class="fillgrp">${fills}</g>` + lines;
}

/* ── state & render ──────────────────────────────────────── */
let current = new Date();
let monthCursor = new Date();
const $ = id => document.getElementById(id);
const DOW = ["S","M","T","W","T","F","S"];
const MON = ["January","February","March","April","May","June","July","August","September","October","November","December"];

function render(){
  const f = flowerFor(current), q = quoteFor(current), rnd = rngFor(current);
  drawFlower($("flower"), f, rnd);
  $("latin").textContent  = f.la;
  $("common").innerHTML   = `<b>${f.co}</b> &nbsp;·&nbsp; ${f.fam}`;
  $("quote").textContent  = "“" + q[0] + "”";
  $("attr").textContent   = "— " + q[1];
  $("acc").textContent    = `ACC ${current.getFullYear()}·${String(ord(current)).padStart(3,"0")}`;
  $("datelabel").textContent = current.toLocaleDateString(undefined,
    {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  if($("month").classList.contains("open")) renderMonth();
  if(audioOn) retune();
}

function renderMonth(){
  const y = monthCursor.getFullYear(), m = monthCursor.getMonth();
  $("mlabel").textContent = `${MON[m]} ${y}`;
  $("dows").innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join("");
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m+1, 0).getDate();
  const today = new Date(); let cells = "";
  for(let i = 0; i < first; i++) cells += `<div class="cell blank"></div>`;
  for(let d = 1; d <= days; d++){
    const dt = new Date(y, m, d), f = flowerFor(dt);
    const sel = dt.toDateString() === current.toDateString();
    const now = dt.toDateString() === today.toDateString();
    cells += `<button class="cell${sel ? " sel" : ""}${now ? " now" : ""}" data-d="${d}"
        aria-label="${MON[m]} ${d}">
        <span class="num">${d}</span>
        <span class="mark" style="background:${f.c1}"></span></button>`;
  }
  $("grid").innerHTML = cells;
  $("grid").querySelectorAll(".cell[data-d]").forEach(b => b.onclick = () => {
    current = new Date(y, m, +b.dataset.d); render();
  });
}

const shift = n => { current = new Date(current.getFullYear(), current.getMonth(), current.getDate()+n); render(); };
$("prev").onclick = () => shift(-1);
$("next").onclick = () => shift(1);
$("datelabel").onclick = () => {
  const mo = $("month"); mo.classList.toggle("open");
  if(mo.classList.contains("open")){ monthCursor = new Date(current); renderMonth(); }
};
$("mprev").onclick = () => { monthCursor.setMonth(monthCursor.getMonth()-1); renderMonth(); };
$("mnext").onclick = () => { monthCursor.setMonth(monthCursor.getMonth()+1); renderMonth(); };
document.addEventListener("keydown", e => {
  if(e.key === "ArrowLeft") shift(-1);
  if(e.key === "ArrowRight") shift(1);
});

/* ── the room tone ────────────────────────────────────────
   Generative rather than a looped file: a sustained pad plus
   sparse bells drawn from a pentatonic set, so it never hits
   a seam. The key follows the day.                          */
let audioOn = false, pad, bell, verb, loopA, loopB, chordSet = [];
const SCALES = [
  ["C3","Eb3","F3","G3","Bb3","C4","Eb4","F4","G4"],
  ["D3","F3","G3","A3","C4","D4","F4","G4","A4"],
  ["A2","C3","D3","E3","G3","A3","C4","D4","E4"],
  ["F3","Ab3","Bb3","C4","Eb4","F4","Ab4","Bb4","C5"],
  ["G2","Bb2","C3","D3","F3","G3","Bb3","C4","D4"]
];
let scale = SCALES[0];

function retune(){ scale = SCALES[idx(current, SCALES.length, 3)]; }

async function startAudio(){
  await Tone.start();
  verb = new Tone.Reverb({decay:9, wet:.62}).toDestination();
  const filt = new Tone.Filter(760, "lowpass").connect(verb);

  pad = new Tone.PolySynth(Tone.AMSynth, {
    volume:-26,
    envelope:{attack:5, decay:3, sustain:.75, release:9},
    modulationEnvelope:{attack:6, decay:2, sustain:.5, release:8}
  }).connect(filt);

  bell = new Tone.PolySynth(Tone.FMSynth, {
    volume:-30, harmonicity:2.4, modulationIndex:5,
    envelope:{attack:.01, decay:2.6, sustain:0, release:2.4}
  }).connect(verb);

  new Tone.LFO({frequency:.018, min:480, max:1150}).connect(filt.frequency).start();

  retune();
  loopA = new Tone.Loop(t => {
    const r = () => scale[Math.floor(Math.random()*scale.length)];
    pad.triggerAttackRelease([r(), r(), r()], "12s", t);
  }, 11).start(0);

  loopB = new Tone.Loop(t => {
    if(Math.random() < .55)
      bell.triggerAttackRelease(scale[Math.floor(Math.random()*scale.length)], "2n", t);
  }, 3.5).start(1);

  Tone.Transport.start();
}

$("sound").onclick = async function(){
  if(!audioOn){
    this.setAttribute("aria-pressed","true");
    $("soundlabel").textContent = "Sound on";
    audioOn = true;
    if(!pad) await startAudio(); else Tone.Transport.start();
  } else {
    this.setAttribute("aria-pressed","false");
    $("soundlabel").textContent = "Sound off";
    audioOn = false;
    Tone.Transport.pause();
  }
};

render();
</script>
